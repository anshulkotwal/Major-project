version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: learning-assistant-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: learning-assistant

  app:
    build: .
    container_name: learning-assistant-app
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/learning-assistant
      - NODE_ENV=production
    env_file:
      - .env

volumes:
  mongodb_data:
